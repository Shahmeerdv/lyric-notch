<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyric Notch</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="notch" class="idle">
      <div id="disc"><img id="art" alt="" /><i></i></div>
      <div id="body">
        <div id="meta">
          <div id="title"></div>
          <div id="artist"></div>
        </div>
        <div id="prev" class="line dim"></div>
        <div id="current" class="line"><span></span></div>
        <div id="next" class="line dim"></div>
      </div>
      <div id="side">
        <div id="eq"><b></b><b></b><b></b><b></b><b></b></div>
        <div id="ctrl">
          <button data-act="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
          <button data-act="toggle" id="play" title="Play / pause">
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button data-act="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
        </div>
      </div>
      <span id="measure"></span>
      <div id="bar"><div id="fill"></div></div>
    </div>

    <div id="scrim"></div>
    <div id="menu">
      <div class="m-head"><span class="m-dot"></span>Lyric Notch</div>
      <div class="grid">
        <div class="tile span2">
          <div class="t-label">Lyric sync</div>
          <div class="stepper">
            <button data-act="lead-down" title="Show lyrics later">&minus;</button>
            <b id="lead-val" data-act="lead-reset" title="Reset to 400 ms">400 ms</b>
            <button data-act="lead-up" title="Show lyrics earlier">+</button>
          </div>
        </div>
        <div class="tile span2">
          <div class="t-label">Size</div>
          <div class="seg">
            <button data-size="0.8">S</button>
            <button data-size="1">M</button>
            <button data-size="1.25">L</button>
          </div>
        </div>
        <div class="tile span4 color">
          <div class="t-label">Color</div>
          <div class="swatches">
            <button data-theme="auto" class="sw-auto" title="Follow album cover"></button>
            <button data-theme="#1db954" style="--c:#1db954" title="Green"></button>
            <button data-theme="#ff2d95" style="--c:#ff2d95" title="Pink"></button>
            <button data-theme="#2ea8ff" style="--c:#2ea8ff" title="Blue"></button>
            <button data-theme="#ff8a1f" style="--c:#ff8a1f" title="Orange"></button>
            <button data-theme="#a855ff" style="--c:#a855ff" title="Purple"></button>
          </div>
        </div>
        <button class="tile tog" data-pref="float"><svg viewBox="0 0 24 24"><path d="M4 3h16v2H4zM6 8h12a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3z"/></svg><span>Floating</span></button>
        <button class="tile tog" data-pref="glow"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg><span>Glow</span></button>
        <button class="tile tog" data-pref="spin"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span>Spin</span></button>
        <button class="tile tog" data-pref="eq"><svg viewBox="0 0 24 24"><path d="M4 10h3v10H4zM10.5 4h3v16h-3zM17 13h3v7h-3z"/></svg><span>Bars</span></button>
        <button class="tile danger span4" data-act="quit"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2zM17.8 5.6l-1.4 1.4A7 7 0 1 1 7.6 7L6.2 5.6a9 9 0 1 0 11.6 0z"/></svg><span>Close Lyric Notch</span></button>
      </div>
    </div>
  </body>
</html>
